# Rate limiting zones
# general: 5 r/s per IP (burst 10) - all requests
# submit:  1 r/m per IP (burst 3)  - form spam protection (LLM money)
limit_req_zone $binary_remote_addr zone=general:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=submit:10m rate=1r/m;

# HTTP → HTTPS редирект
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name legalmind.su www.legalmind.su;

    if ($host = www.legalmind.su) {
        return 301 https://$host$request_uri;
    }
    if ($host = legalmind.su) {
        return 301 https://$host$request_uri;
    }

    return 404;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name legalmind.su www.legalmind.su;

    ssl_certificate /etc/letsencrypt/live/legalmind.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalmind.su/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 2M;

    # Static files
    location /static/ {
        alias /opt/legal_mind/web/static/;
        expires 7d;
        access_log off;
    }

    # /submit - hard limit (LLM + PDF = money)
    location = /submit {
        limit_req zone=submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else - to gunicorn
    location / {
        limit_req zone=general burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
