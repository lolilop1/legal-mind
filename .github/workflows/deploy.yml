name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-not-for-prod
          PYTHONIOENCODING: utf-8
        run: python tests/run_all.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/legal_mind
            git fetch origin main
            git reset --hard origin/main
            chown -R legal:legal .
            chmod 600 web/.env
            chmod 755 core region modules web deploy
            chmod -R 755 web/static
            find web/static -type f -exec chmod 644 {} \;
            systemctl restart legal-mind
            sleep 3
            curl -sf http://127.0.0.1:5000/health || (echo "HEALTH FAIL" && exit 1)
            echo "DEPLOY OK"