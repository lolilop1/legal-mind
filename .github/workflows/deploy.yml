name: Deploy to VPS

on:
  # Запускается ТОЛЬКО после успешного Tests workflow (см. test.yml)
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  # Ручной запуск в обход (если тесты вдруг не гоняются)
  workflow_dispatch:

jobs:
  deploy:
    # Только если Tests завершился успешно, ИЛИ ручной запуск
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/legal_mind

            # Запоминаем предыдущий рабочий коммит для отката
            PREV=$(git rev-parse HEAD)
            echo "PREV=$PREV"

            git fetch origin main
            git reset --hard origin/main

            chown -R legal:legal .
            chmod 600 web/.env
            chmod 755 core region modules web deploy scripts
            chmod -R 755 web/static
            find web/static -type f -exec chmod 644 {} \;
            # Обёртка backup для cron — обязательно executable,
            # git не всегда сохраняет x-бит (особенно на Windows-репах)
            chmod 755 scripts/run_backup.sh
            chown legal:legal scripts/run_backup.sh

            systemctl restart legal-mind
            sleep 3

            # ─── Health-check новой версии ───
            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              echo "DEPLOY OK (HEAD=$(git rev-parse --short HEAD))"
              exit 0
            fi

            # ─── Провал → откат на PREV ───
            echo "::warning::HEALTH FAIL after deploy — rolling back to $PREV"
            git reset --hard "$PREV"
            systemctl restart legal-mind
            sleep 3

            if curl -sf http://127.0.0.1:5000/health >/dev/null; then
              echo "::error::DEPLOY ROLLED BACK to $PREV — prod works on OLD version, fix the new one"
              exit 1
            fi

            echo "::error::CRITICAL: rollback failed too — service is DOWN"
            exit 2