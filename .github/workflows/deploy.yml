name: Deploy to VPS

on:
  # Запускается ТОЛЬКО после успешного Tests workflow (см. test.yml)
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  # Ручной запуск в обход (если тесты вдруг не гоняются)
  workflow_dispatch:

jobs:
  deploy:
    # Только если Tests завершился успешно, ИЛИ ручной запуск
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/legal_mind
            git fetch origin main
            git reset --hard origin/main
            chown -R legal:legal .
            chmod 600 web/.env
            chmod 755 core region modules web deploy
            chmod -R 755 web/static
            find web/static -type f -exec chmod 644 {} \;
            systemctl restart legal-mind
            sleep 3
            curl -sf http://127.0.0.1:5000/health || (echo "HEALTH FAIL" && exit 1)
            echo "DEPLOY OK"